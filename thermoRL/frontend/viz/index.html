<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThermoRL</title>
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <div class="title-row">
          <h1 id="app-title"></h1>
          <span id="app-badge" class="badge badge-replay"></span>
        </div>
        <div class="control-row">
          <label id="lbl-exp"><select id="sel-exp"></select></label>
          <label id="lbl-seed"><select id="sel-seed"></select></label>
          <label id="lbl-cmp"><select id="sel-cmp"></select></label>
          <div class="segmented" role="group" aria-labelledby="lbl-overlay">
            <span id="lbl-overlay"></span>
            <button type="button" id="overlay-tc" aria-pressed="true"></button>
            <button type="button" id="overlay-kw" aria-pressed="false"></button>
            <button type="button" id="overlay-occupied" aria-pressed="false"></button>
          </div>
          <div class="drawer-buttons">
            <button type="button" id="btn-outcome" aria-pressed="false" aria-controls="drawer"></button>
            <button type="button" id="btn-why" aria-pressed="false" aria-controls="drawer"></button>
            <button type="button" id="btn-about" aria-pressed="false" aria-controls="drawer"></button>
          </div>
        </div>
        <div id="identity"></div>
      </header>

      <div id="body">
        <main id="stage" data-state="loading">
          <canvas id="gl"></canvas>
          <div id="panels" hidden>
            <section class="panel" id="panel-left">
              <div class="panel-head"><h2 id="title-left"></h2><span id="badge-left" class="badge" hidden></span></div>
              <div class="panel-body">
                <div id="view-left" class="view"></div>
                <div id="legend-left" class="legend" data-mount="legend"></div>
              </div>
            </section>
            <section class="panel" id="panel-right">
              <div class="panel-head"><h2 id="title-right"></h2><span id="badge-right" class="badge" hidden></span></div>
              <div class="panel-body">
                <div id="view-right" class="view"></div>
                <div id="legend-right" class="legend" data-mount="legend"></div>
              </div>
            </section>
          </div>
          <div id="status" class="status" hidden></div>
          <div id="fallback" hidden></div>
        </main>
        <aside id="drawer" hidden data-drawer="">
          <div id="drawer-body" data-mount="drawer"></div>
        </aside>
      </div>

      <section id="timeline" data-mount="timeline"><canvas id="timeline-canvas"></canvas></section>
      <section id="controls"></section>
    </div>
    <div id="tooltip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
