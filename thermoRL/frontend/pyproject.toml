[project]
name = "thermorl"
version = "0.1.0"
description = "ThermoRL Phase 1 — thermal-aware placement under cooling scarcity"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thermorl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
